schema_version = 1
id = "grace-event-registry-v1"
title = "New observability event — canon-first registration"
base_sha = "ae8dba4f4f1aeeb55604eca005927df688e5f553"
base_tree = "598ee39b17f2f12cb0b7dda7a673cebded285cd9"
prompt_file = "prompt.md"
rubric_file = "rubric.md"
timeout_seconds = 1800
dependency_links = ["node_modules"]

allowed_paths = [
  "grace/canon/observability.xml",
  "apps/api/app/core/logging_events.py",
  "lib/log/events.gen.ts",
  "components/profile/checkin-statistics.tsx",
  "__tests__/components/CheckinStatistics.test.tsx",
  "grace/verification-matrix.md",
]

[[verification]]
name = "registry-drift"
command = "python3 -c \"import sys; sys.path.insert(0,'scripts'); import check_logging_guardrails as g; sys.exit(0 if g.check_registry_drift() else 1)\""
timeout_seconds = 300

[[verification]]
name = "frontend-checkin-statistics"
command = "npx vitest run __tests__/components/CheckinStatistics.test.tsx --passWithNoTests"
timeout_seconds = 600

[[verification]]
name = "typescript"
command = "npx tsc --noEmit"
timeout_seconds = 600

[[verification]]
name = "grace-backend"
command = "python3 scripts/grace_lint.py apps/api/app"
timeout_seconds = 300

[[verification]]
name = "diff-check"
command = "git diff --check"
timeout_seconds = 60
