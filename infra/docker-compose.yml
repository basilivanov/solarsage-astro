# DEV/COMPATIBILITY ONLY. NOT the production source of truth.
# Production canon:
#   - app stack: infra/production/docker-compose.app.yml (api/sidecar/frontend)
#   - DB stack:  infra/production/docker-compose.yml (PostgreSQL, port 5433)
# This file provisions Postgres + Redis for the local dev-loop only.
# SolarSage sidecar is NOT defined here: production runs it as container
# solarsage-sidecar in the canonical app stack; dev-loop may point
# SOLARSAGE_BASE_URL at an external sidecar (dev-only).

services:
  postgres:
    image: postgres:16-alpine
    container_name: astro-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astro}
      POSTGRES_DB: ${POSTGRES_DB:-astro}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - astro_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astro} -d ${POSTGRES_DB:-astro}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: astro-dev-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - astro_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  astro_pg_data:
  astro_redis_data:
