# ############################################################################
# AI_HEADER: SOLARSAGE_TMPFILES — systemd-tmpfiles config for runtime paths
# ROLE: Creates the global maintenance lock file on fresh/rebooted hosts.
# DEPENDENCIES: systemd-tmpfiles
# GRACE_ANCHORS: [TMPFILES_MAINTENANCE_LOCK]
# ############################################################################

# START_MODULE_CONTRACT: M-INFRA-PRODUCTION-TMPFILES
# purpose: Standard tmpfiles.d declaration for solarsage runtime paths.
# owns:
#   - infra/production/tmpfiles.d/solarsage.conf
# inputs: none
# outputs: /run/solarsage-maintenance.lock root:astro 0660 on tmpfiles --create/boot.
# dependencies: none
# side_effects: tmpfiles creates the lock file with exact owner/group/mode.
# emitted_logs: none
# invariants:
#   - Declarative systemd-tmpfiles only; no custom state machine.
#   - The lock file is never truncated or removed by tmpfiles rules.
# failure_policy: systemd-tmpfiles reports rule errors at create/clean time.
# END_MODULE_CONTRACT: M-INFRA-PRODUCTION-TMPFILES

# START_MODULE_MAP: M-INFRA-PRODUCTION-TMPFILES
# public_entrypoints: none
# semantic_blocks:
#   - TMPFILES_MAINTENANCE_LOCK: global maintenance lock declaration
# END_MODULE_MAP: M-INFRA-PRODUCTION-TMPFILES

# Type Path                          Mode User  Group Age Argument
f     /run/solarsage-maintenance.lock 0660 root  astro -    -
