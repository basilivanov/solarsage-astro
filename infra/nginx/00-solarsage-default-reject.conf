# ############################################################################
# AI_HEADER: NGINX_DEFAULT_REJECT — default reject config
# ROLE: Rejects connections with unknown hostnames or invalid TLS SNI.
# DEPENDENCIES: nginx
# ############################################################################

# START_MODULE_CONTRACT: M-NGINX-DEFAULT-REJECT
# purpose: Catch-all block to reject unknown HTTP/HTTPS traffic.
# owns:
#   - infra/nginx/00-solarsage-default-reject.conf
# inputs: none
# outputs:
#   - HTTP listener on port 80 returning 444
#   - HTTPS listener on port 443 rejecting handshake
# dependencies: none
# invariants:
#   - No production certificate used here.
#   - Reject unknown Host/SNI.
# failure_policy: none.
# END_MODULE_CONTRACT: M-NGINX-DEFAULT-REJECT

# START_MODULE_MAP: M-NGINX-DEFAULT-REJECT
# public_entrypoints: none
# semantic_blocks:
#   - DEFAULT_REJECT: server blocks configuration
# END_MODULE_MAP: M-NGINX-DEFAULT-REJECT

# START_BLOCK: DEFAULT_REJECT
# Default HTTP server rejecting all requests with status 444 (Connection Closed without Response)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Default HTTPS server rejecting TLS handshakes for unknown SNI hostnames
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Reject SSL handshakes for unknown SNI
    ssl_reject_handshake on;
}
# END_BLOCK: DEFAULT_REJECT
