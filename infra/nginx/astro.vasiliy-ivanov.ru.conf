# ############################################################################
# AI_HEADER: MODULE_INFRA_NGINX_CONF
# ROLE: Production Nginx configuration for astro.vasiliy-ivanov.ru.
# DEPENDENCIES: nginx, certbot-certificates
# GRACE_ANCHORS: [NGINX_CONF]
# ############################################################################

# START_MODULE_CONTRACT: M-INFRA-NGINX-CONF
# purpose: Route HTTP/HTTPS traffic to Next.js frontend and FastAPI backend with SSL.
# owns:
#   - infra/nginx/astro.vasiliy-ivanov.ru.conf
# inputs: none
# outputs:
#   - public listener on ports 80 and 443 routing to loopback services
# dependencies: none
# invariants:
#   - Only serve astro.vasiliy-ivanov.ru.
#   - Safe headers (HSTS, X-Content-Type-Options, Referrer-Policy, Permissions-Policy).
#   - Block dotfiles except ACME challenge.
#   - No dev/test ports or domains referenced.
# failure_policy: none.
# END_MODULE_CONTRACT: M-INFRA-NGINX-CONF

# START_MODULE_MAP: M-INFRA-NGINX-CONF
# public_entrypoints:
#   - nginx_config
# semantic_blocks:
#   - NGINX_CONF: server blocks configuration
# END_MODULE_MAP: M-INFRA-NGINX-CONF

# START_BLOCK: NGINX_CONF
# HTTP Server: Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name astro.vasiliy-ivanov.ru;

    # Let's Encrypt ACME Challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name astro.vasiliy-ivanov.ru;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/astro.vasiliy-ivanov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astro.vasiliy-ivanov.ru/privkey.pem;

    # Standard SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers (conservative HSTS for first launch)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 5m;

    # Block dotfiles
    location ~ /\. {
        deny all;
    }

    # ACME Challenge (just in case Certbot needs it over SSL)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # API Backend Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Timeouts for slow LLM generation
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Pass cookies
        proxy_pass_header Set-Cookie;
    }

    # Frontend Proxy
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# END_BLOCK: NGINX_CONF
