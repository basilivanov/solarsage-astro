# ############################################################################
# AI_HEADER: MODULE_INFRA_NGINX_CONF
# ROLE: Production Nginx configuration for astro.vasiliy-ivanov.ru.
# DEPENDENCIES: nginx, certbot-certificates
# GRACE_ANCHORS: [NGINX_CONF]
# WAVE: W-NAMED-PROMO-CAMPAIGN
# ############################################################################

# START_MODULE_CONTRACT: M-INFRA-NGINX-CONF
# purpose: Route HTTP/HTTPS traffic to Next.js frontend and FastAPI backend with SSL, privacy-safe logging without raw start_params/referers, and promo volumetric rate limiting.
# owns:
#   - infra/nginx/astro.vasiliy-ivanov.ru.conf
# inputs: none
# outputs:
#   - public listener on ports 80 and 443 routing to loopback services
# dependencies: none
# invariants:
#   - Only serve astro.vasiliy-ivanov.ru.
#   - Safe headers (HSTS, X-Content-Type-Options, Referrer-Policy: strict-origin, Permissions-Policy).
#   - Privacy log format excludes $request, $request_uri, $args, $query_string, and $http_referer.
#   - Promo location anchored to ~ ^/api/promo/(preview|redeem)$ with 120r/m rate, burst=60 nodelay, 1k body cap, and 429 rate limit.
# failure_policy: none.
# END_MODULE_CONTRACT: M-INFRA-NGINX-CONF

# START_MODULE_MAP: M-INFRA-NGINX-CONF
# public_entrypoints:
#   - nginx_config
# semantic_blocks:
#   - NGINX_CONF: server blocks and privacy logging configuration
# owned_tests:
#   - apps/api/tests/test_nginx_promo_privacy.py
# END_MODULE_MAP: M-INFRA-NGINX-CONF

# START_BLOCK: NGINX_CONF
# Privacy log format excluding raw query strings, start_param and HTTP Referer
log_format astro_privacy '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent" '
                        'rt=$request_time urt=$upstream_response_time cid="$http_x_correlation_id"';

# Volumetric rate limiting zone for promo endpoints (120 requests per minute per IP)
limit_req_zone $binary_remote_addr zone=promo_limit:10m rate=120r/m;
limit_req_status 429;

# HTTP Server: Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name astro.vasiliy-ivanov.ru;

    access_log /var/log/nginx/astro.access.log astro_privacy;

    # Let's Encrypt ACME Challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://astro.vasiliy-ivanov.ru$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name astro.vasiliy-ivanov.ru;

    access_log /var/log/nginx/astro.access.log astro_privacy;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/astro.vasiliy-ivanov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astro.vasiliy-ivanov.ru/privkey.pem;

    # Standard SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers (strict-origin Referrer-Policy to prevent query string leakage)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 5m;

    # Custom 429 response for rate-limited requests
    error_page 429 = @promo_rate_limited;

    location @promo_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 429 '{"detail":{"code":"RATE_LIMITED","message":"Слишком много запросов."}}';
    }

    # ACME Challenge (just in case Certbot needs it over SSL)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # Block dotfiles (excluding .well-known)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Volumetric Rate-Limited Promo API Backend Proxy
    location ~ ^/api/promo/(preview|redeem)$ {
        limit_req zone=promo_limit burst=60 nodelay;

        client_max_body_size 1k;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Timeouts for slow API generation
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Canonical proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Pass cookies
        proxy_pass_header Set-Cookie;
    }

    # API Backend Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Timeouts for slow LLM generation
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Pass cookies
        proxy_pass_header Set-Cookie;
    }

    # Frontend Proxy
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# END_BLOCK: NGINX_CONF
