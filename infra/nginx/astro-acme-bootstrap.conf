# ############################################################################
# AI_HEADER: NGINX_ACME_BOOTSTRAP — temporary bootstrap config for certbot
# ROLE: Serves ACME challenge requests on port 80 before SSL certificate is issued.
# DEPENDENCIES: nginx
# ############################################################################

# START_MODULE_CONTRACT: M-NGINX-ACME-BOOTSTRAP
# purpose: Temporary Nginx config to solve ACME HTTP-01 challenge.
# owns:
#   - infra/nginx/astro-acme-bootstrap.conf
# inputs: none
# outputs:
#   - HTTP listener on port 80 serving /.well-known/acme-challenge/ from webroot
# dependencies: none
# invariants:
#   - Only serve astro.vasiliy-ivanov.ru.
#   - Return 503 with Retry-After for all other paths.
#   - Do not redirect to HTTPS.
# failure_policy: none.
# END_MODULE_CONTRACT: M-NGINX-ACME-BOOTSTRAP

# START_MODULE_MAP: M-NGINX-ACME-BOOTSTRAP
# public_entrypoints: none
# semantic_blocks:
#   - ACME_BOOTSTRAP: server blocks configuration
# END_MODULE_MAP: M-NGINX-ACME-BOOTSTRAP

# START_BLOCK: ACME_BOOTSTRAP
server {
    listen 80;
    listen [::]:80;
    server_name astro.vasiliy-ivanov.ru;

    # Let's Encrypt ACME Challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # Return 503 for all other paths before SSL cert is installed
    location / {
        add_header Retry-After 60;
        return 503;
    }
}
# END_BLOCK: ACME_BOOTSTRAP
