[project]
name = "solarsage"
version = "1.0.0"
description = "SolarSage HTTP sidecar for astrological calculations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "solarsage-contracts==0.1.0",
    "pydantic-settings>=2.6.0",
    "pyswisseph>=2.10.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov",
    "pytest-xdist>=3.6.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["F", "E4", "E7"]
