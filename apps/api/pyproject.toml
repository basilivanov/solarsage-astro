[project]
name = "astro-api"
version = "0.1.0"
description = "Astro Mini App backend (FastAPI orchestrator)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.3",
  "uvicorn[standard]>=0.32",
  "pydantic==2.13.4",
  "solarsage-contracts==0.1.0",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "httpx>=0.28",
  "orjson>=3.10",
  "structlog>=24.4",
  "anthropic>=0.40.0",
  "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-xdist",
  "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["F", "E4", "E7"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "app.schemas.*",
    "app.db.models",
    "app.services.*",
]
disable_error_code = ["call-arg", "attr-defined", "arg-type", "misc", "assignment"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring the live audit environment (excluded from ordinary unit coverage)",
    "benchmark: wall-clock performance benchmarks (excluded from the coverage-gate run; coverage instrumentation distorts timings)",
]
