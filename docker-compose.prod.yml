# AI_HEADER
# module: M-DEPLOY-PROD
# wave: W-DEPLOY
# purpose: NAMESPACED Docker Compose — dev/compatibility ONLY, for running
#   alongside other projects. NOT the production source of truth.
#
# Production canon:
#   - app stack: infra/production/docker-compose.app.yml (api/sidecar/frontend)
#   - DB stack:  infra/production/docker-compose.yml (PostgreSQL, port 5433)
#
# PORT MAP (host → container, compatibility only):
#   8002 → API (FastAPI)
#   8003 → SolarSage sidecar
#   5434 → PostgreSQL
#   6382 → Redis
#
# Use this file when you need to avoid port conflicts with other projects
# in a dev/compatibility loop. nginx and next.config must be updated to
# match if you switch compose files.

services:
  # PostgreSQL database (compatibility)
  db:
    image: postgres:16-alpine
    container_name: solarsage-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astro}
      POSTGRES_USER: ${POSTGRES_USER:-astro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - solarsage_postgres_prod:/var/lib/postgresql/data
    ports:
      - "5434:5432"  # Compatibility на порту 5434
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astro}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - solarsage-network

  # Redis (compatibility)
  redis:
    image: redis:7-alpine
    container_name: solarsage-redis-prod
    ports:
      - "6382:6379"  # Compatibility на порту 6382
    volumes:
      - solarsage_redis_prod:/data
    restart: unless-stopped
    networks:
      - solarsage-network

  # API backend (compatibility)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: solarsage-api-prod
    environment:
      DATABASE_URL: postgresql+asyncpg://astro:${POSTGRES_PASSWORD}@db:5432/astro
      APP_ENV: production
      APP_DOMAIN: ${APP_DOMAIN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME}
      WEBAPP_URL: ${WEBAPP_URL}
      BOT_ADMIN_IDS: ${BOT_ADMIN_IDS}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SOLARSAGE_BASE_URL: http://solarsage:8001
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8000"  # Compatibility API на порту 8002
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - solarsage-network

  # SolarSage sidecar (compatibility)
  solarsage:
    build:
      context: .
      dockerfile: apps/solarsage/Dockerfile
    container_name: solarsage-sidecar-prod
    ports:
      - "8003:8001"  # Compatibility SolarSage на порту 8003
    restart: unless-stopped
    networks:
      - solarsage-network

  # Frontend (compatibility) - опционально
  # frontend:
  #   build:
  #     context: ./apps/web
  #     dockerfile: Dockerfile
  #   container_name: solarsage-frontend-prod
  #   ports:
  #     - "3001:80"
  #   environment:
  #     VITE_API_URL: https://${APP_DOMAIN}/api
  #   restart: unless-stopped
  #   networks:
  #     - solarsage-network

volumes:
  solarsage_postgres_prod:
  solarsage_redis_prod:

networks:
  solarsage-network:
    driver: bridge
