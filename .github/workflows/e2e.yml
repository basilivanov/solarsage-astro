name: E2E Tests

on:
  workflow_dispatch:  # manual only, CI disabled
    inputs:
      suite:
        type: choice
        description: 'E2E Suite Selection'
        options:
          - smoke
          - full
        default: smoke

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: astro
          POSTGRES_PASSWORD: astro_test_password
          POSTGRES_DB: astro
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required secrets are non-empty
        env:
          E2E_TELEGRAM_BOT_TOKEN: ${{ secrets.E2E_TELEGRAM_BOT_TOKEN }}
          E2E_OPENROUTER_API_KEY: ${{ secrets.E2E_OPENROUTER_API_KEY }}
        run: |
          if [ -z "$E2E_TELEGRAM_BOT_TOKEN" ]; then
            echo "Error: E2E_TELEGRAM_BOT_TOKEN secret is empty" >&2
            exit 1
          fi
          if [ -z "$E2E_OPENROUTER_API_KEY" ]; then
            echo "Error: E2E_OPENROUTER_API_KEY secret is empty" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/solarsage/pyproject.toml
            packages/py-contracts/pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./packages/py-contracts
          python -m pip install -e './apps/solarsage[dev]'
          python -m pip install -e './apps/api[dev]'
          python -m pip check

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://astro:astro_test_password@localhost:5432/astro
        run: |
          cd apps/api
          alembic upgrade head

      - name: Install Playwright browsers (Chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Start services (Sidecar, API, Frontend)
        env:
          E2E_TELEGRAM_BOT_TOKEN: ${{ secrets.E2E_TELEGRAM_BOT_TOKEN }}
          E2E_OPENROUTER_API_KEY: ${{ secrets.E2E_OPENROUTER_API_KEY }}
        shell: bash
        run: |
          # 1. Prepare ephemeris path
          mkdir -p /tmp/solarsage-e2e-ephe

          # 2. Define cleanup function
          cleanup_stack() {
            echo "Cleaning up E2E stack processes..."
            if [ -f /tmp/solarsage-e2e-sidecar.pid ]; then
              kill "$(cat /tmp/solarsage-e2e-sidecar.pid)" || true
              rm -f /tmp/solarsage-e2e-sidecar.pid
            fi
            if [ -f /tmp/solarsage-e2e-api.pid ]; then
              kill "$(cat /tmp/solarsage-e2e-api.pid)" || true
              rm -f /tmp/solarsage-e2e-api.pid
            fi
            if [ -f /tmp/solarsage-e2e-frontend.pid ]; then
              kill "$(cat /tmp/solarsage-e2e-frontend.pid)" || true
              rm -f /tmp/solarsage-e2e-frontend.pid
            fi
          }

          trap cleanup_stack EXIT INT TERM

          # 3. Start Sidecar (port 18091)
          export SOLARSAGE_EPHEMERIS_PATH=/tmp/solarsage-e2e-ephe
          export PYTHONPATH=apps/solarsage
          python -m uvicorn solarsage.app:app --host 127.0.0.1 --port 18091 > /tmp/solarsage-e2e-sidecar.log 2>&1 &
          echo $! > /tmp/solarsage-e2e-sidecar.pid

          # Wait for Sidecar
          for i in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:18091/v1/health >/dev/null 2>&1; then
              echo "Sidecar is healthy."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Error: Sidecar failed to start. Logs:" >&2
              tail -n 100 /tmp/solarsage-e2e-sidecar.log >&2
              exit 1
            fi
            sleep 1
          done

          # 4. Start API (port 8000) - Scoped env to prevent leaking secrets to Next build
          # Secrets are passed via step-level env and used as quoted variables
          (
            export DATABASE_URL=postgresql+asyncpg://astro:astro_test_password@127.0.0.1:5432/astro
            export REDIS_URL=redis://127.0.0.1:6379/0
            export APP_ENV=test
            export APP_DOMAIN=localhost
            export DEV_MODE=false
            export SESSION_COOKIE_SECURE=false
            export GRACE_USER_SALT=test-salt-32-bytes-minimum-change
            export JWT_SECRET=test-jwt-secret-value-must-be-long-enough-32-bytes-minimum
            export SOLARSAGE_URL=http://127.0.0.1:18091
            export LLM_PROVIDER=openrouter
            export TELEGRAM_BOT_TOKEN="$E2E_TELEGRAM_BOT_TOKEN"
            export OPENROUTER_API_KEY="$E2E_OPENROUTER_API_KEY"
            export LLM_MODEL=openai/gpt-4o-mini

            python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --app-dir apps/api > /tmp/solarsage-e2e-api.log 2>&1 &
            echo $! > /tmp/solarsage-e2e-api.pid
          )

          # Wait for API
          for i in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "API is healthy."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Error: API failed to start. Logs:" >&2
              tail -n 100 /tmp/solarsage-e2e-api.log >&2
              exit 1
            fi
            sleep 1
          done

          # 5. Build and Start Frontend (port 3002)
          # We use production build to test production assets and real routing.
          # Explicitly unsetting/removing secrets from build child environment using env -u
          env -u E2E_TELEGRAM_BOT_TOKEN -u E2E_OPENROUTER_API_KEY -u TELEGRAM_BOT_TOKEN -u OPENROUTER_API_KEY pnpm run build

          env -u E2E_TELEGRAM_BOT_TOKEN -u E2E_OPENROUTER_API_KEY -u TELEGRAM_BOT_TOKEN -u OPENROUTER_API_KEY pnpm exec next start -H 127.0.0.1 -p 3002 > /tmp/solarsage-e2e-frontend.log 2>&1 &
          echo $! > /tmp/solarsage-e2e-frontend.pid

          # Wait for Frontend
          for i in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:3002/ >/dev/null 2>&1; then
              echo "Frontend is healthy."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Error: Frontend failed to start. Logs:" >&2
              tail -n 100 /tmp/solarsage-e2e-frontend.log >&2
              exit 1
            fi
            sleep 1
          done

          # 6. Run E2E tests based on suite input - Scoped secrets env
          (
            export E2E_BASE_URL=http://127.0.0.1:3002
            export E2E_API_BASE_URL=http://127.0.0.1:8000
            export TELEGRAM_BOT_TOKEN="$E2E_TELEGRAM_BOT_TOKEN"
            export CI=true

            if [ "${{ github.event.inputs.suite }}" = "smoke" ]; then
              echo "Running E2E smoke suite..."
              pnpm exec playwright test today.spec.ts calendar.spec.ts cross-feature-navigation.spec.ts --project=chromium
            else
              echo "Running E2E full suite..."
              pnpm exec playwright test e2e/*.spec.ts --project=chromium
            fi
          )

          # Remove trap and perform normal cleanup
          trap - EXIT INT TERM
          cleanup_stack

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: /tmp/solarsage-e2e-*.log
          retention-days: 7
