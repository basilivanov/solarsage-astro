# ############################################################################
# AI_HEADER: MODULE_E2E_WORKFLOW
# ROLE: Reusable real-stack E2E harness (manual suites + release gate reused
#       by the production deploy workflow via workflow_call).
# DEPENDENCIES: GitHub Actions, postgres/redis services, pnpm, playwright
# ############################################################################

# START_MODULE_CONTRACT: M-E2E-WORKFLOW
# purpose: Run the real-HMAC Playwright suites against an ephemeral real stack
#   (postgres/redis services + sidecar + API + built frontend). Manual
#   smoke/full suites are preserved; the release suite is the blocking gate
#   reused by deploy-production.yml via workflow_call.
# owns:
#   - .github/workflows/e2e.yml
# inputs:
#   - workflow_dispatch: suite choice (smoke | release | full, default smoke)
#   - workflow_call: suite string (required) and required secrets
#     E2E_TELEGRAM_BOT_TOKEN / E2E_OPENROUTER_API_KEY /
#     E2E_GEONAMES_USERNAME (real GeoNames account for the ephemeral API
#     only, scrubbed from the frontend build) /
#     YOOKASSA_TEST_SHOP_ID / YOOKASSA_TEST_SECRET_KEY (sandbox billing
#     credentials, API subshell only, scrubbed from the frontend build/start
#     and the test runner; recurrent stays disabled)
# outputs: Playwright pass/fail; uploaded reports/artifacts; cleaned-up users.
# dependencies: scripts/generate-telegram-test-initdata.py,
#   scripts/acceptance/cleanup_e2e_users.py, e2e/* specs.
# invariants:
#   - The release suite uses the single TODAY_CONVERGENCE_RELEASE_SPECS list
#     from Makefile: the real Today convergence spec plus the Today/calendar
#     mock visual contracts. Other release-critical real flows remain explicit
#     in their own suites; deleted legacy Today/calendar specs are not invoked.
#   - The ephemeral sidecar runs ONLY in explicit Moshier-only mode
#     (SOLARSAGE_EPHEMERIS_ALLOW_MOSHIER=1 + SOLARSAGE_APP_ENV=development,
#     identical to ci.yml); the production SWIEPH fail-closed proof stays
#     with the image build verifier and the artifact-acceptance gate, never
#     with this ephemeral stack.
#   - Missing required E2E secrets fail closed before any stack starts.
#   - Created E2E users are always cleaned up via the acceptance adapter.
# failure_policy: any failing spec fails the job; the secrets check exits 1;
#   the release suite also fails on flaky results (--fail-on-flaky-tests),
#   retries are kept for diagnosis only.
# END_MODULE_CONTRACT: M-E2E-WORKFLOW

# START_MODULE_MAP: M-E2E-WORKFLOW
# public_entrypoints:
#   - workflow_dispatch (manual suites)
#   - workflow_call (reusable release gate)
# semantic_blocks:
#   - TEST_JOB: ephemeral stack + suite runner + cleanup
# END_MODULE_MAP: M-E2E-WORKFLOW

name: E2E Tests

on:
  workflow_dispatch:  # manual only, CI disabled
    inputs:
      suite:
        type: choice
        description: 'E2E Suite Selection'
        options:
          - smoke
          - release
          - full
        default: smoke
  workflow_call:
    inputs:
      suite:
        type: string
        description: 'E2E suite to run (smoke | release | full)'
        required: true
    secrets:
      E2E_TELEGRAM_BOT_TOKEN:
        required: true
      E2E_OPENROUTER_API_KEY:
        required: true
      E2E_GEONAMES_USERNAME:
        required: true
      YOOKASSA_TEST_SHOP_ID:
        required: true
      YOOKASSA_TEST_SECRET_KEY:
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: astro
          POSTGRES_PASSWORD: astro_test_password
          POSTGRES_DB: astro
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required secrets are non-empty
        env:
          E2E_TELEGRAM_BOT_TOKEN: ${{ secrets.E2E_TELEGRAM_BOT_TOKEN }}
          E2E_OPENROUTER_API_KEY: ${{ secrets.E2E_OPENROUTER_API_KEY }}
          E2E_GEONAMES_USERNAME: ${{ secrets.E2E_GEONAMES_USERNAME }}
          YOOKASSA_TEST_SHOP_ID: ${{ secrets.YOOKASSA_TEST_SHOP_ID }}
          YOOKASSA_TEST_SECRET_KEY: ${{ secrets.YOOKASSA_TEST_SECRET_KEY }}
        run: |
          if [ -z "$E2E_TELEGRAM_BOT_TOKEN" ]; then
            echo "Error: E2E_TELEGRAM_BOT_TOKEN secret is empty" >&2
            exit 1
          fi
          if [ -z "$E2E_OPENROUTER_API_KEY" ]; then
            echo "Error: E2E_OPENROUTER_API_KEY secret is empty" >&2
            exit 1
          fi
          if [ -z "$E2E_GEONAMES_USERNAME" ]; then
            echo "Error: E2E_GEONAMES_USERNAME secret is empty (real geo autocomplete cannot work without it)" >&2
            exit 1
          fi
          if [ -z "$YOOKASSA_TEST_SHOP_ID" ]; then
            echo "Error: YOOKASSA_TEST_SHOP_ID secret is empty (sandbox release proof cannot run)" >&2
            exit 1
          fi
          if [ -z "$YOOKASSA_TEST_SECRET_KEY" ]; then
            echo "Error: YOOKASSA_TEST_SECRET_KEY secret is empty (sandbox release proof cannot run)" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/solarsage/pyproject.toml
            packages/py-contracts/pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./packages/py-contracts
          python -m pip install -e './apps/solarsage[dev]'
          python -m pip install -e './apps/api[dev]'
          python -m pip check

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://astro:astro_test_password@localhost:5432/astro
        run: |
          cd apps/api
          alembic upgrade head

      - name: Install Playwright browsers (Chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Start services (Sidecar, API, Frontend)
        env:
          E2E_TELEGRAM_BOT_TOKEN: ${{ secrets.E2E_TELEGRAM_BOT_TOKEN }}
          E2E_OPENROUTER_API_KEY: ${{ secrets.E2E_OPENROUTER_API_KEY }}
          E2E_GEONAMES_USERNAME: ${{ secrets.E2E_GEONAMES_USERNAME }}
          YOOKASSA_TEST_SHOP_ID: ${{ secrets.YOOKASSA_TEST_SHOP_ID }}
          YOOKASSA_TEST_SECRET_KEY: ${{ secrets.YOOKASSA_TEST_SECRET_KEY }}
        shell: bash
        run: |
          # 1. Define cleanup function
          cleanup_stack() {
            echo "Cleaning up E2E stack processes..."
            if [ -f /tmp/solarsage-e2e-sidecar.pid ]; then
              kill "$(cat /tmp/solarsage-e2e-sidecar.pid)" || true
              rm -f /tmp/solarsage-e2e-sidecar.pid
            fi
            if [ -f /tmp/solarsage-e2e-api.pid ]; then
              kill "$(cat /tmp/solarsage-e2e-api.pid)" || true
              rm -f /tmp/solarsage-e2e-api.pid
            fi
            if [ -f /tmp/solarsage-e2e-frontend.pid ]; then
              kill "$(cat /tmp/solarsage-e2e-frontend.pid)" || true
              rm -f /tmp/solarsage-e2e-frontend.pid
            fi
          }

          trap cleanup_stack EXIT INT TERM

          # 2. Start Sidecar (port 18091) — explicit Moshier-only E2E mode,
          # identical to the ci.yml integration mode. The production SWIEPH
          # proof is NOT weakened here: it is enforced separately by the
          # image build verifier and the artifact-acceptance gate.
          export SOLARSAGE_EPHEMERIS_ALLOW_MOSHIER=1
          export SOLARSAGE_APP_ENV=development
          export PYTHONPATH=apps/solarsage
          python -m uvicorn solarsage.app:app --host 127.0.0.1 --port 18091 > /tmp/solarsage-e2e-sidecar.log 2>&1 &
          echo $! > /tmp/solarsage-e2e-sidecar.pid

          # Wait for Sidecar
          for i in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:18091/v1/health >/dev/null 2>&1; then
              echo "Sidecar is healthy."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Error: Sidecar failed to start. Logs:" >&2
              tail -n 100 /tmp/solarsage-e2e-sidecar.log >&2
              exit 1
            fi
            sleep 1
          done

          # 3. Start API (port 8000) - Scoped env to prevent leaking secrets to Next build
          # Secrets are passed via step-level env and used as quoted variables
          (
            export DATABASE_URL=postgresql+asyncpg://astro:astro_test_password@127.0.0.1:5432/astro
            export REDIS_URL=redis://127.0.0.1:6379/0
            export APP_ENV=test
            export APP_DOMAIN=localhost
            export DEV_MODE=false
            export SESSION_COOKIE_SECURE=false
            export GRACE_USER_SALT=test-salt-32-bytes-minimum-change
            export JWT_SECRET=test-jwt-secret-value-must-be-long-enough-32-bytes-minimum
            export SOLARSAGE_URL=http://127.0.0.1:18091
            export LLM_PROVIDER=openrouter
            export TELEGRAM_BOT_TOKEN="$E2E_TELEGRAM_BOT_TOKEN"
            export OPENROUTER_API_KEY="$E2E_OPENROUTER_API_KEY"
            export LLM_MODEL=openai/gpt-4.1-nano
            # Real GeoNames account for /api/geo/* city/timezone lookups in
            # the ephemeral API (scoped to this subshell only, never the
            # frontend build); without it autocomplete answers 400.
            export GEONAMES_USERNAME="$E2E_GEONAMES_USERNAME"
            # Natal full-report flag ON for the ephemeral E2E stack only
            # (production default stays false) so the real generate path is
            # exercised by the release gate.
            export NATAL_REPORT_ENABLED=true
            # YooKassa SANDBOX billing for the release proof: test-mode
            # credentials scoped to this API subshell ONLY (scrubbed from the
            # frontend build/start and the test runner). Recurrent stays OFF
            # (no real rebill); the loopback webhook allowlist exists only
            # because APP_ENV=test — production keeps the empty override.
            export YOOKASSA_ENABLED=true
            export YOOKASSA_MODE=test
            export YOOKASSA_TEST_SHOP_ID="$YOOKASSA_TEST_SHOP_ID"
            export YOOKASSA_TEST_SECRET_KEY="$YOOKASSA_TEST_SECRET_KEY"
            export YOOKASSA_RECURRENT_ENABLED=false
            export YOOKASSA_RETURN_URL="https://localhost/billing/return"
            export YOOKASSA_WEBHOOK_IP_ALLOWLIST="127.0.0.1/32"

            python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --app-dir apps/api > /tmp/solarsage-e2e-api.log 2>&1 &
            echo $! > /tmp/solarsage-e2e-api.pid
          )

          # The sandbox credentials were consumed ONLY by the API subshell
          # above (subshell exports never propagate back). Scrub them from
          # the remaining shell so the frontend build/start AND the
          # Playwright test runner never inherit them (the env -u wrappers
          # below cover build/start; this unset covers the runner).
          unset YOOKASSA_TEST_SHOP_ID YOOKASSA_TEST_SECRET_KEY

          # Wait for API
          for i in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "API is healthy."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Error: API failed to start. Logs:" >&2
              tail -n 100 /tmp/solarsage-e2e-api.log >&2
              exit 1
            fi
            sleep 1
          done

          # 4. Build and Start Frontend (port 3002)
          # We use production build to test production assets and real routing.
          # Explicitly unsetting/removing secrets from build child environment using env -u
          env -u E2E_TELEGRAM_BOT_TOKEN -u E2E_OPENROUTER_API_KEY -u E2E_GEONAMES_USERNAME -u YOOKASSA_TEST_SHOP_ID -u YOOKASSA_TEST_SECRET_KEY -u TELEGRAM_BOT_TOKEN -u OPENROUTER_API_KEY -u GEONAMES_USERNAME pnpm run build

          env -u E2E_TELEGRAM_BOT_TOKEN -u E2E_OPENROUTER_API_KEY -u E2E_GEONAMES_USERNAME -u YOOKASSA_TEST_SHOP_ID -u YOOKASSA_TEST_SECRET_KEY -u TELEGRAM_BOT_TOKEN -u OPENROUTER_API_KEY -u GEONAMES_USERNAME pnpm exec next start -H 127.0.0.1 -p 3002 > /tmp/solarsage-e2e-frontend.log 2>&1 &
          echo $! > /tmp/solarsage-e2e-frontend.pid

          # Wait for Frontend
          for i in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:3002/ >/dev/null 2>&1; then
              echo "Frontend is healthy."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Error: Frontend failed to start. Logs:" >&2
              tail -n 100 /tmp/solarsage-e2e-frontend.log >&2
              exit 1
            fi
            sleep 1
          done

          # 5. Run E2E tests based on suite input - Scoped secrets env
          (
            export E2E_BASE_URL=http://127.0.0.1:3002
            export E2E_API_BASE_URL=http://127.0.0.1:8000
            export TELEGRAM_BOT_TOKEN="$E2E_TELEGRAM_BOT_TOKEN"
            export E2E_RUN_SALT="${{ github.run_id }}"
            export E2E_CREATED_USERS_FILE=/tmp/solarsage-e2e-created-users.jsonl
            export CI=true

            if [ "${{ inputs.suite }}" = "smoke" ]; then
              echo "Running E2E smoke suite..."
              pnpm exec playwright test e2e/today-convergence.spec.ts e2e/mock-visual/today-convergence.spec.ts e2e/mock-visual/calendar.spec.ts --project=chromium
            elif [ "${{ inputs.suite }}" = "release" ]; then
              echo "Running E2E release gate suite..."
              # The Makefile owns this exact release list for local/CI parity.
              make e2e-release
            else
              echo "Running E2E full suite..."
              pnpm exec playwright test e2e/*.spec.ts --project=chromium
            fi
          )

          # Remove trap and perform normal cleanup
          trap - EXIT INT TERM
          cleanup_stack

      - name: Cleanup created E2E users (ephemeral acceptance DB, always runs)
        if: always()
        env:
          APP_ENV: acceptance
          DATABASE_URL: postgresql+asyncpg://astro:astro_test_password@localhost:5432/astro
          E2E_CREATED_USERS_FILE: /tmp/solarsage-e2e-created-users.jsonl
        run: python scripts/acceptance/cleanup_e2e_users.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: /tmp/solarsage-e2e-*.log
          retention-days: 7
