# ############################################################################
# AI_HEADER: MODULE_CI_WORKFLOW
# ROLE: GitHub Actions CI pipeline for backend, sidecar, frontend, and contracts.
# DEPENDENCIES: GitHub Actions, pytest, vitest, pnpm
# ############################################################################

# START_MODULE_CONTRACT: M-CI-WORKFLOW
# purpose: Automated CI pipeline for backend, sidecar, frontend, and contract tests.
# owns:
#   - .github/workflows/ci.yml
# inputs:
#   - push to main branch
#   - pull request to main branch
#   - workflow_dispatch
#   - workflow_call (reusable by deploy-production source-quality gate)
# outputs:
#   - test results (pass/fail)
#   - build artifacts
# dependencies:
#   - packages/py-contracts
#   - apps/api
#   - apps/solarsage
#   - __tests__/contracts
# side_effects:
#   - runs tests on GitHub runners
# invariants:
#   - all Python jobs use Python 3.12
#   - shared Python package is installed before API/sidecar packages
#   - contract checkout fetches full history for merge-base compatibility checks
#   - CI never uses automatic breaking-contract override
#   - wall-clock benchmarks run WITHOUT coverage instrumentation in a separate
#     step (coverage tracing distorts timings; the coverage gate excludes them)
# failure_policy:
#   - any job failure -> CI fails
# non_goals:
#   - deployment, package publication, automatic E2E execution
# END_MODULE_CONTRACT: M-CI-WORKFLOW

# START_MODULE_MAP: M-CI-WORKFLOW
# public_entrypoints:
#   - GitHub Actions trigger
# semantic_blocks:
#   - BACKEND_PIPELINE: API install/tests and existing gates.
#   - SIDECAR_PIPELINE: sidecar install/tests.
#   - FRONTEND_PIPELINE: frontend unit/build job.
#   - CONTRACT_PIPELINE: contract generation, compatibility, runtime, and typecheck gates.
# owned_tests:
#   - runs unit/integration tests in CI
# END_MODULE_MAP: M-CI-WORKFLOW

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # START_BLOCK: BACKEND_PIPELINE
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            apps/api/pyproject.toml
            packages/py-contracts/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./packages/py-contracts
          python -m pip install -e './apps/api[dev]'
          python -m pip install -e './apps/solarsage[dev]'
          python -m pip check

      - name: Start sidecar for integration tests (explicit Moshier-only CI mode)
        run: |
          SOLARSAGE_EPHEMERIS_ALLOW_MOSHIER=1 SOLARSAGE_APP_ENV=development \
            nohup python -m uvicorn solarsage.app:app --host 127.0.0.1 --port 18091 >/tmp/sidecar.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18091/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18091/v1/health

      - name: Run backend tests with coverage gate (TOTAL >= 81 + critical files)
        env:
          APP_ENV: test
          GRACE_USER_SALT: ci-coverage-salt-0123456789abcdef0123456789ab
          SOLARSAGE_URL: http://127.0.0.1:18091
          COVERAGE_FILE: /tmp/api.coverage
        run: |
          set -o pipefail
          # -n 2 --dist=loadfile: measured 131.6s -> 80.6s (-39%) on the same
          # suite with no coverage regression and totals deterministic
          # across xdist repeats (2026-07-22, local 4-CPU).
          python -m pytest apps/api/tests -q -m "not integration and not benchmark" \
            -n 2 --dist=loadfile \
            --cov=apps/api/app --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:/tmp/api-coverage.xml | tee /tmp/api-coverage.txt
          # TOTAL floor 81 (measured 81.77; floor sits at the measured baseline)
          python -m coverage report --precision=2 --fail-under=81
          python -m coverage report --include="apps/api/app/api/auth.py" --fail-under=60
          python -m coverage report --include="apps/api/app/api/geo.py" --fail-under=50
          python -m coverage report --include="apps/api/app/api/referral.py" --fail-under=43
          python -m coverage report --include="apps/api/app/api/telegram_webhook.py" --fail-under=88
          python -m coverage report --include="apps/api/app/services/access_service.py" --fail-under=68
          python -m coverage report --include="apps/api/app/services/geonames.py" --fail-under=50
          python -m coverage report --include="apps/api/app/services/llm_service.py" --fail-under=58
          python -m coverage report --include="apps/api/app/services/today_interpretation_service.py" --fail-under=85
          python -m coverage report --include="apps/api/app/services/today_service.py" --fail-under=88

      - name: Run pipeline benchmark (no coverage instrumentation)
        env:
          APP_ENV: test
          GRACE_USER_SALT: ci-coverage-salt-0123456789abcdef0123456789ab
          SOLARSAGE_URL: http://127.0.0.1:18091
        run: |
          # Benchmarks measure wall-clock latency: coverage tracing inflates
          # timings ~3x and made the absolute 100ms bound flaky on shared
          # runners (observed 114.87ms). Measured here WITHOUT instrumentation.
          python -m pytest apps/api/tests -q -m "benchmark"

      - name: Changed-lines coverage (diff-cover, >= 80%)
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install diff-cover
          diff-cover /tmp/api-coverage.xml --compare-branch=origin/main --fail-under=80

      - name: Upload API coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: |
            /tmp/api-coverage.txt
            /tmp/api-coverage.xml
          retention-days: 14

      - name: Run audit golden snapshots gate
        run: python scripts/check_audit_golden.py

      - name: Run performance budgets gate
        run: python scripts/check_v2_performance_budgets.py

      - name: Run rollout gates validation
        run: python scripts/check_solarsage_v2_rollout_gates.py

      - name: Run logging guardrails check
        run: python scripts/check_logging_guardrails.py
  # END_BLOCK: BACKEND_PIPELINE

  # START_BLOCK: SIDECAR_PIPELINE
  sidecar-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            apps/solarsage/pyproject.toml
            packages/py-contracts/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./packages/py-contracts
          python -m pip install -e './apps/solarsage[dev]'
          python -m pip check

      - name: Run sidecar tests with coverage gate (TOTAL >= 90 + critical files)
        env:
          COVERAGE_FILE: /tmp/sidecar.coverage
        run: |
          set -o pipefail
          # -n 2 --dist=loadfile: measured 38.8s -> 20.1s (-48%) on the same
          # suite with byte-identical coverage totals and totals deterministic
          # across xdist repeats (2026-07-22, local 4-CPU).
          python -m pytest apps/solarsage/tests -q \
            -n 2 --dist=loadfile \
            --cov=apps/solarsage/solarsage --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:/tmp/sidecar-coverage.xml | tee /tmp/sidecar-coverage.txt
          # TOTAL floor 90 (measured 90.97 after dead calculator.py removal)
          python -m coverage report --precision=2 --fail-under=90
          python -m coverage report --include="apps/solarsage/solarsage/services/eclipses.py" --fail-under=85
          python -m coverage report --include="apps/solarsage/solarsage/services/firdar.py" --fail-under=85
          python -m coverage report --include="apps/solarsage/solarsage/services/progressions.py" --fail-under=90
          python -m coverage report --include="apps/solarsage/solarsage/services/returns.py" --fail-under=75
          python -m coverage report --include="apps/solarsage/solarsage/services/transit_timing.py" --fail-under=90
          python -m coverage report --include="apps/solarsage/solarsage/utils/ephemeris.py" --fail-under=88

      - name: Upload sidecar coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-coverage
          path: |
            /tmp/sidecar-coverage.txt
            /tmp/sidecar-coverage.xml
          retention-days: 14
  # END_BLOCK: SIDECAR_PIPELINE

  # START_BLOCK: FRONTEND_PIPELINE
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint (eslint)
        run: pnpm run lint

      - name: Run frontend tests with coverage (v8 thresholds)
        run: npx vitest run --coverage

      - name: Upload frontend coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14

      - name: Build frontend
        run: pnpm run build
  # END_BLOCK: FRONTEND_PIPELINE

  # START_BLOCK: CONTRACT_PIPELINE
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            apps/api/pyproject.toml
            packages/py-contracts/pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./packages/py-contracts
          python -m pip install -e './apps/api[dev]'
          python -m pip check

      - name: Select contract base ref
        if: github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "CONTRACT_BASE_REF=${{ github.event.before }}" >> "$GITHUB_ENV"
          else
            echo "CONTRACT_BASE_REF=HEAD^" >> "$GITHUB_ENV"
          fi

      - name: Run contract check
        run: pnpm contracts:check

      - name: Run compatibility check
        run: python scripts/contracts/check_compat.py

      - name: Run contract vitest files
        run: npx vitest run __tests__/contracts

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit
  # END_BLOCK: CONTRACT_PIPELINE
