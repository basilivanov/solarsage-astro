# ############################################################################
# AI_HEADER: MODULE_DEPLOY_PRODUCTION_WORKFLOW
# ROLE: GitHub Actions manual production pipeline: reusable exact-SHA quality
#       gate (local ci.yml), immutable image build/push, artifact acceptance,
#       approved SSH deploy with integrated orchestrator smoke/rollback, and an
#       annotated immutable Git release tag.
# DEPENDENCIES: GitHub Actions, local ./.github/workflows/ci.yml, docker buildx, ssh, git
# ############################################################################

# START_MODULE_CONTRACT: M-DEPLOY-PRODUCTION-WORKFLOW
# purpose: Manually build, publish, accept and deploy immutable per-SHA OCI
#   images with a blocking CI-status quality gate, artifact acceptance, and an
#   immutable annotated release tag after a proven deploy.
# owns:
#   - .github/workflows/deploy-production.yml
# inputs:
#   - workflow_dispatch (manual only)
#   - REGISTRY_NAMESPACE: repository-level Actions variable (e.g. ghcr.io/owner,
#     no tag; required because the build job has no environment)
#   - EPHEMERIS_BUNDLE_URL / EPHEMERIS_BUNDLE_SHA256: repository variables for
#     the licensed bundle source/checksum; EPHEMERIS_BUNDLE_CREDENTIAL secret
#     optional (falls back to github.token; GitHub API asset URLs get the
#     octet-stream Accept header, other https URLs keep Bearer-only behavior)
#   - PROD_HOST / PROD_USER / PROD_SSH_PRIVATE_KEY / PROD_KNOWN_HOSTS: production
#     environment secrets
# outputs: immutable per-SHA images in GHCR, deployed exact SHA on the
#   production host, annotated immutable prod tag.
# dependencies: GitHub API CI status check (source-quality),
#   ./.github/workflows/visual-regression.yml (visual-baselines),
#   ./.github/workflows/e2e.yml (real-e2e release gate), docker/buildx
#   (build/push), ssh + forced-command orchestrator (deploy),
#   git + GITHUB_TOKEN (tag push)
# invariants:
#   - Manual trigger only; no push to main deploys by itself.
#   - source-quality gates build by verifying the existing CI run for the
#     exact SHA finished successfully (no duplicate CI run).
#   - real-e2e (reusable ./.github/workflows/e2e.yml, release suite of
#     existing real-HMAC no-interception specs) gates deploy: a failing real
#     flow blocks migrate/deploy/tag; missing E2E secrets fail closed.
#   - tag is created only after a successful deploy; immutable annotated
#     prod-<utc>-<short12sha>, never overwritten; health/smoke/rollback stay
#     inside the orchestrator (no second functional-smoke job).
#   - Concurrency group production-deploy, cancel-in-progress: false.
#   - GITHUB_REF must be refs/heads/main; GITHUB_SHA exactly 40 lowercase hex.
#   - Image tags are exactly the full GITHUB_SHA; no latest/branch/mutable tag.
#   - The production environment gate stands between build/push and SSH.
#   - SSH executes exactly "migrate $GITHUB_SHA" and only then
#     "deploy $GITHUB_SHA" (two separate forced commands); the remote wrapper
#     invokes only the orchestrator. Migration runs on every manual run —
#     Alembic upgrade is a no-op when the release carries no new revisions —
#     and a migration or head-check failure blocks the deploy step.
#   - Ephemeral SSH key is strictly removed at the end.
#   - Permissions are minimal and explicit per job.
# failure_policy: fails on validation, build/push, approval or SSH failure.
# END_MODULE_CONTRACT: M-DEPLOY-PRODUCTION_WORKFLOW

# START_MODULE_MAP: M-DEPLOY-PRODUCTION-WORKFLOW
# public_entrypoints:
#   - GitHub Actions trigger
# semantic_blocks:
#   - SOURCE_QUALITY_JOB: CI status gate for the exact SHA
#   - VISUAL_BASELINES_JOB: reusable visual baseline gate
#   - REAL_E2E_JOB: reusable real-HMAC release gate (e2e.yml release suite)
#   - BUILD_JOB: immutable image build and push
#   - ACCEPTANCE_JOB: migration + sidecar/ephemeris + golden acceptance
#     (pre-convergence freeze/V2/UI steps retired 2026-08-10)
#   - DEPLOY_JOB: environment approval and exact SSH migrate + deploy
#   - TAG_JOB: immutable annotated release tag after successful deploy
# END_MODULE_MAP: M-DEPLOY-PRODUCTION-WORKFLOW

name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # START_BLOCK: SOURCE_QUALITY_JOB
  # Blocking release-quality gate: instead of re-running the full CI suite,
  # verify that the existing CI run for the exact SHA finished successfully.
  # This removes ~20 minutes of duplicate work on every deploy while keeping
  # the fail-closed behavior (no green CI -> no build, no deploy).
  source-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI success on exact SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          WORKFLOW="ci.yml"
          MAX_ATTEMPTS=50
          SLEEP_SECONDS=30

          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            response=$(curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?head_sha=$GITHUB_SHA&per_page=1")

            count=$(echo "$response" | jq '.total_count')
            if [ "$count" -eq 0 ]; then
              echo "Error: no CI runs found for SHA $GITHUB_SHA" >&2
              exit 1
            fi

            status=$(echo "$response" | jq -r '.workflow_runs[0].status')
            conclusion=$(echo "$response" | jq -r '.workflow_runs[0].conclusion')

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI run for $GITHUB_SHA succeeded"
                exit 0
              else
                echo "Error: CI run for $GITHUB_SHA finished with conclusion: $conclusion" >&2
                exit 1
              fi
            fi

            echo "CI run status: $status (attempt $i/$MAX_ATTEMPTS), waiting..."
            sleep "$SLEEP_SECONDS"
          done

          echo "Error: timed out waiting for CI run for $GITHUB_SHA" >&2
          exit 1
  # END_BLOCK: SOURCE_QUALITY_JOB

  # START_BLOCK: VISUAL_BASELINES_JOB
  # Blocking visual baseline gate (reusable visual-regression workflow,
  # baseline suite only — no acceptance-day, no new harness).
  visual-baselines:
    uses: ./.github/workflows/visual-regression.yml
  # END_BLOCK: VISUAL_BASELINES_JOB

  # START_BLOCK: REAL_E2E_JOB
  # Blocking real-HMAC E2E release gate (reusable e2e workflow, release suite
  # only: onboarding-real, today, calendar, cross-feature-navigation,
  # profile-city-checkin — no route interception, no new harness). Runs the
  # ephemeral real stack; missing E2E secrets fail closed inside the reusable
  # workflow and block the deploy.
  real-e2e:
    needs: [source-quality, visual-baselines]
    uses: ./.github/workflows/e2e.yml
    with:
      suite: release
    secrets:
      E2E_TELEGRAM_BOT_TOKEN: ${{ secrets.E2E_TELEGRAM_BOT_TOKEN }}
      E2E_OPENROUTER_API_KEY: ${{ secrets.E2E_OPENROUTER_API_KEY }}
      E2E_GEONAMES_USERNAME: ${{ secrets.E2E_GEONAMES_USERNAME }}
      YOOKASSA_TEST_SHOP_ID: ${{ secrets.YOOKASSA_TEST_SHOP_ID }}
      YOOKASSA_TEST_SECRET_KEY: ${{ secrets.YOOKASSA_TEST_SECRET_KEY }}
  # END_BLOCK: REAL_E2E_JOB

  # START_BLOCK: BUILD_JOB
  build:
    needs: [source-quality, visual-baselines]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Verify branch and SHA
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Error: Deployment is only allowed from refs/heads/main. Current ref is $GITHUB_REF." >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Error: GITHUB_SHA must be a 40-character lowercase hexadecimal string." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify registry namespace
        env:
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
        run: |
          if [[ ! "$REGISTRY_NAMESPACE" =~ ^[a-z0-9./:_-]+$ ]]; then
            echo "Error: REGISTRY_NAMESPACE variable is missing or invalid." >&2
            exit 1
          fi
          case "$REGISTRY_NAMESPACE" in
            *":latest"*|*":")
              echo "Error: REGISTRY_NAMESPACE must not carry a tag." >&2
              exit 1
              ;;
          esac

      - name: Log in to registry
        env:
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
          REGISTRY_HOST: ${{ vars.REGISTRY_NAMESPACE }}
        run: |
          host="${REGISTRY_HOST%%/*}"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
            docker login "$host" -u "${{ github.actor }}" --password-stdin

      - name: Fetch and verify licensed ephemeris bundle (fail closed)
        env:
          EPHEMERIS_BUNDLE_URL: ${{ vars.EPHEMERIS_BUNDLE_URL }}
          EPHEMERIS_BUNDLE_SHA256: ${{ vars.EPHEMERIS_BUNDLE_SHA256 }}
          # Private release assets need a token: the explicit secret wins,
          # otherwise the workflow GITHUB_TOKEN is used (never printed).
          EPHEMERIS_BUNDLE_CREDENTIAL: ${{ secrets.EPHEMERIS_BUNDLE_CREDENTIAL || github.token }}
        run: |
          set -euo pipefail
          : "${EPHEMERIS_BUNDLE_URL:?missing required repository variable EPHEMERIS_BUNDLE_URL (OCI/release-asset source of the licensed bundle tar) — sidecar image cannot be proven without it}"
          : "${EPHEMERIS_BUNDLE_SHA256:?missing required repository variable EPHEMERIS_BUNDLE_SHA256 (exact tar checksum)}"
          case "$EPHEMERIS_BUNDLE_URL" in
            https://*) ;;
            *) echo "Error: EPHEMERIS_BUNDLE_URL must be an https URL" >&2; exit 1 ;;
          esac
          if [[ ! "$EPHEMERIS_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Error: EPHEMERIS_BUNDLE_SHA256 must be 64 lowercase hex" >&2; exit 1
          fi
          auth_args=()
          if [ -n "${EPHEMERIS_BUNDLE_CREDENTIAL:-}" ]; then
            auth_args=(-H "Authorization: Bearer ${EPHEMERIS_BUNDLE_CREDENTIAL}")
          fi
          # GitHub API release-asset URLs require the octet-stream Accept
          # header (browser_download_url rejects tokens on private releases);
          # every other https URL keeps the previous behavior.
          case "$EPHEMERIS_BUNDLE_URL" in
            https://api.github.com/repos/*/releases/assets/*)
              auth_args+=(-H "Accept: application/octet-stream") ;;
          esac
          curl -fsSL --retry 3 "${auth_args[@]}" -o /tmp/ephemeris-bundle.tar "$EPHEMERIS_BUNDLE_URL"
          echo "$EPHEMERIS_BUNDLE_SHA256  /tmp/ephemeris-bundle.tar" | sha256sum -c -
          mkdir -p /tmp/ephemeris-bundle
          python3 -c 'import tarfile; tarfile.open("/tmp/ephemeris-bundle.tar").extractall("/tmp/ephemeris-bundle", filter="data")'
          rm -f /tmp/ephemeris-bundle.tar

      - name: Build and push immutable images
        env:
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for img in api sidecar frontend; do
            dockerfile="apps/$img/Dockerfile"
            if [ "$img" = "sidecar" ]; then
              dockerfile="apps/solarsage/Dockerfile"
            fi
            if [ "$img" = "frontend" ]; then
              dockerfile="apps/web/Dockerfile"
            fi
            tag="$REGISTRY_NAMESPACE/solarsage-$img:$GITHUB_SHA"
            build_args=(
              --build-arg "RELEASE_SHA=$GITHUB_SHA"
              --build-arg "PROD_API_REWRITE_BASE_URL=http://api:8000"
              --tag "$tag"
              --file "$dockerfile"
              --push
              .
            )
            if [ "$img" = "sidecar" ]; then
              build_args=(--build-context "ephemeris=/tmp/ephemeris-bundle" "${build_args[@]}")
            fi
            docker buildx build "${build_args[@]}"
          done

      - name: Prove pushed image digests
        env:
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for img in api sidecar frontend; do
            docker buildx imagetools inspect "$REGISTRY_NAMESPACE/solarsage-$img:$GITHUB_SHA" >/dev/null
          done
  # END_BLOCK: BUILD_JOB

  # START_BLOCK: ACCEPTANCE_JOB
  # Blocking release-quality acceptance: clean alembic-head migration on an
  # ephemeral DB, sidecar-from-image boot with baked ephemeris identity proof,
  # and the offline golden snapshots gate. The pre-convergence freeze/V2/UI
  # steps were retired 2026-08-10 (see TODO(convergence-acceptance) below).
  artifact-acceptance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: astro
          POSTGRES_PASSWORD: acceptance-pw
          POSTGRES_DB: astro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astro -d astro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies into the Makefile venv path
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install --upgrade pip
          apps/api/.venv/bin/pip install -e ./packages/py-contracts -e './apps/api[dev]' -e './apps/solarsage[dev]'

      - name: Run migrations on the ephemeral acceptance DB
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://astro:acceptance-pw@127.0.0.1:5432/astro
        # alembic.ini lives in apps/api: the command MUST run from the app
        # root (repo-root execution exits 255 with a missing script_location).
        run: .venv/bin/alembic upgrade head

      # TODO(convergence-acceptance): the pre-convergence audit steps were
      # retired on 2026-08-10 (deploy run 31338043760 analysis):
      #   * Seed/freeze steps validated the today.v2.2 payload shape retired by
      #     the spheres/facets rework; frozen-2026-08-04.json is a legacy-shape
      #     canary replayed offline in CI (test_frozen_day_contract.py).
      #   * The freeze Makefile target needs a live API on :8000 which this job
      #     never started (job topology predates the W6-S2 freeze rewrite).
      # Current coverage: ci.yml runs the offline golden + frozen-contract
      # replay + full backend/frontend suites; this pipeline adds the
      # visual-baselines gate and the real-e2e release suite on the CURRENT
      # contract. Remaining unique proofs here: clean-alembic-head migration,
      # sidecar-from-image + baked ephemeris identity, offline golden gate.
      # Realignment (new convergence freeze + same-payload UI proof) is a
      # separate work package — see docs/work/2026-08-06_spheres-and-facets-rework/.

      - name: Log in to registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start sidecar from the exact image (production mode, baked ephemeris)
        env:
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run -d --name acceptance-sidecar -p 127.0.0.1:18091:8001 \
            -e SOLARSAGE_APP_ENV=production \
            -e SOLARSAGE_RELEASE_SHA="$GITHUB_SHA" \
            "$REGISTRY_NAMESPACE/solarsage-sidecar:$GITHUB_SHA"
          ok=""
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18091/v1/health > /tmp/sidecar-health.json 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { docker logs acceptance-sidecar | tail -30; exit 1; }
          python3 -c 'import json,sys; h=json.load(open("/tmp/sidecar-health.json")); assert h.get("engine")=="swieph", h; assert h.get("release_sha")=="'"$GITHUB_SHA"'", h; assert not h.get("fallback", True), h; print("sidecar health OK:", h["engine"], h["ephemeris_artifact_id"])'

      - name: Extract the baked ephemeris bundle for the astronomy oracle
        run: |
          set -euo pipefail
          rm -rf /tmp/audit-ephe && mkdir -p /tmp/audit-ephe
          # The bundle is baked read-only (dirs 0555, files 0444) on purpose.
          # `docker cp` extracts client-side as the unprivileged runner user and
          # applies source modes eagerly, so it cannot create files inside the
          # fresh 0555 dirs (proven: run 29943208636, "open
          # /tmp/audit-ephe/ephe/seas_18.se1: permission denied"). Stream a tar
          # from the container instead: GNU tar defers directory-mode
          # application until extraction ends. Layout and identity checks below
          # are unchanged; immutability stays enforced (extract is read-only).
          docker exec acceptance-sidecar tar -C /opt/solarsage-ephemeris/bundle -cf - . | tar -C /tmp/audit-ephe -xf -
          echo "AUDIT_EPHEMERIS_PATH=/tmp/audit-ephe/ephe" >> "$GITHUB_ENV"
          python3 - <<'EOF'
          import hashlib, json
          manifest_bytes = open("/tmp/audit-ephe/manifest.json", "rb").read()
          manifest = json.loads(manifest_bytes)
          health = json.load(open("/tmp/sidecar-health.json"))
          assert manifest["artifact_id"] == health["ephemeris_artifact_id"], (
              manifest["artifact_id"], health["ephemeris_artifact_id"],
          )
          digest = hashlib.sha256(manifest_bytes).hexdigest()
          assert digest == health["ephemeris_manifest_sha256"], (
              digest, health["ephemeris_manifest_sha256"],
          )
          print("ephemeris bundle OK:", manifest["artifact_id"], digest[:16])
          EOF

      - name: Golden snapshots gate
        run: apps/api/.venv/bin/python scripts/check_audit_golden.py
  # END_BLOCK: ACCEPTANCE_JOB

  # START_BLOCK: DEPLOY_JOB
  deploy:
    needs: [build, artifact-acceptance, real-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    environment: production

    steps:
      - name: Verify branch and SHA
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Error: Deployment is only allowed from refs/heads/main. Current ref is $GITHUB_REF." >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Error: GITHUB_SHA must be a 40-character lowercase hexadecimal string." >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/solarsage_prod_deploy
          # Safely print key and strip Windows line endings
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/solarsage_prod_deploy
          printf '%s\n' "$PROD_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run database migrations forced-command on production server
        env:
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          # Runs on every manual deploy: Alembic upgrade head is a no-op when
          # the release carries no new revisions. A migration or head-check
          # failure fails this step and blocks the deploy step below.
          ssh -T \
            -i ~/.ssh/solarsage_prod_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$PROD_USER@$PROD_HOST" \
            "migrate $GITHUB_SHA"

      - name: Trigger deploy forced-command on production server
        env:
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh -T \
            -i ~/.ssh/solarsage_prod_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$PROD_USER@$PROD_HOST" \
            "deploy $GITHUB_SHA"

      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/solarsage_prod_deploy ~/.ssh/known_hosts
  # END_BLOCK: DEPLOY_JOB

  # START_BLOCK: TAG_JOB
  # Immutable evidence tag AFTER a successful deploy only. The canonical
  # health + front/geo smoke + recorded rollback authority already run inside
  # the orchestrator during deploy (no second functional-smoke job here).
  tag:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Verify branch and SHA
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "Error: tag only from refs/heads/main" >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Error: GITHUB_SHA must be 40 lowercase hex" >&2; exit 1; }

      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create and push immutable annotated tag
        env:
          GITHUB_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          short=$(printf '%s' "$GITHUB_SHA" | cut -c1-12)
          tag="prod-${ts}-${short}"
          # Remote collision check, fail-closed on any unexpected rc:
          # rc=0 -> tag exists (hard fail), rc=2 -> absent (continue),
          # anything else (network/auth/remote error) -> hard fail.
          remote_rc=0
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Error: tag $tag already exists on origin (immutable, no overwrite)" >&2
            exit 1
          else
            remote_rc=$?
          fi
          if [ "$remote_rc" -ne 2 ]; then
            echo "Error: remote tag collision check failed (rc=$remote_rc)" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Error: tag $tag already exists locally (immutable, no overwrite)" >&2
            exit 1
          fi
          git config user.name "solarsage-deploy-bot"
          git config user.email "deploy@solarsage.local"
          git tag -a "$tag" "$GITHUB_SHA" -m "Production release $tag" -m "Exact SHA: $GITHUB_SHA" -m "Workflow run: $RUN_URL"
          [ "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA" ] || { echo "Error: tag target mismatch" >&2; exit 1; }
          git push origin "refs/tags/$tag"
          echo "tagged: $tag -> $GITHUB_SHA"
  # END_BLOCK: TAG_JOB
