# ############################################################################
# AI_HEADER: MODULE_VISUAL_REGRESSION_WORKFLOW
# ROLE: GitHub Actions manual visual regression pipeline.
# DEPENDENCIES: GitHub Actions, playwright, pnpm
# ############################################################################

name: Visual Regression Tests

on:
  workflow_dispatch:

jobs:
  visual-regression:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps

      - name: Build
        run: pnpm run build

      - name: Start server
        run: pnpm exec next start -H 127.0.0.1 -p 3002 &

      - name: Wait for server
        run: npx wait-on http://localhost:3002

      - name: Run visual regression tests
        run: pnpm exec playwright test e2e/visual-regression.spec.ts

      - name: Upload diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: e2e/**/*-diff.png
