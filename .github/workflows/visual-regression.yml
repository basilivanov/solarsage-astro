# ############################################################################
# AI_HEADER: MODULE_VISUAL_REGRESSION_WORKFLOW
# ROLE: GitHub Actions manual visual regression pipeline.
# DEPENDENCIES: GitHub Actions, playwright, pnpm
# ############################################################################

name: Visual Regression Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run visual regression tests
        shell: bash
        run: |
          cleanup_preview() {
            if [ -f /tmp/solarsage-v2-preview.pid ]; then
              PID=$(cat /tmp/solarsage-v2-preview.pid)
              echo "Stopping preview server (PID: $PID)..."
              kill -TERM "$PID" || true

              # Bounded poll/wait for process to disappear
              for i in {1..50}; do
                if ! kill -0 "$PID" 2>/dev/null; then
                  echo "Preview server stopped."
                  break
                fi
                if [ "$i" -eq 50 ]; then
                  echo "Preview server did not stop. Sending SIGKILL..."
                  kill -KILL "$PID" || true
                fi
                sleep 0.1
              done
              rm -f /tmp/solarsage-v2-preview.pid
            fi
          }
          trap cleanup_preview EXIT INT TERM

          # Start server directly using node
          node e2e/mock-visual/start-v2-preview.mjs > /tmp/solarsage-v2-preview.log 2>&1 &
          echo $! > /tmp/solarsage-v2-preview.pid

          # Wait for server
          for attempt in {1..120}; do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:3003/day/2026-07-08 >/dev/null 2>&1; then
              echo "Server is ready."
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "Error: server did not become ready after 120 attempts. Preview logs:" >&2
              tail -n 100 /tmp/solarsage-v2-preview.log >&2
              exit 1
            fi
            sleep 1
          done

          # Run Playwright tests — baseline suite only (the P1-3
          # acceptance-day spec stays out: it is blocked on the v1 payload
          # by design, not a visual baseline).
          E2E_BASE_URL=http://127.0.0.1:3003 \
            CI=true pnpm exec playwright test \
            e2e/mock-visual/calendar.spec.ts \
            e2e/mock-visual/profile.spec.ts \
            e2e/mock-visual/readings.spec.ts \
            e2e/mock-visual/horary.spec.ts \
            e2e/mock-visual/natal.spec.ts \
            e2e/mock-visual/day-v2.spec.ts \
            e2e/mock-visual/synastry.spec.ts \
            --project=chromium --project=mobile

          # Explicit normal cleanup
          cleanup_preview
          trap - EXIT INT TERM

      - name: Upload diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: test-results/**/*-diff.png
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
