schema_version: product_spheres.v1
status: frozen_w1
description: >-
  Единый продуктовый канон сфер и facets для Today Convergence. Техническая
  таксономия и физические правила scoring живут в отдельных канонах.

canonical_order:
  [work, finance, documents, relationships, sport, communication, health,
   home_family, travel, creativity, study, friends_goals]

allowed_technical_spheres:
  [thinking_speech_learning, work_status_achievement,
   relationships_partnership, money_security_resources, body_energy_health,
   home_family_roots, inner_background_unconscious,
   crisis_transformation_control, meaning_expansion_vector]

allowed_context_keys:
  [career, career_ambition, career_social_status, communication,
   communication_learning, communication_learning_documents, contract,
   creative, creative_work, creativity, crisis_transformation, daily_routine,
   direction_growth_meaning, documents, education, education_documents, family, finance, finance_money,
   financial, foreign, friendship_social, friends, goals, group, health,
   healing, higher_education, hidden_matters, home, home_family, housing,
   inheritance, legal, legal_affairs, local_travel, movement, negotiation,
   obligation, partnership, partnerships_contracts, philosophy,
   private_creativity, project, property, public_image, public_speech,
   recovery, relocation, relationships, resources_security, service_routine,
   sport, study, symptoms, training, transaction, travel, travel_adventure,
   travel_long_distance, work]

allowed_planets: [SUN, MOON, MERCURY, VENUS, MARS, JUPITER, SATURN, URANUS, NEPTUNE, PLUTO]

# These names are accepted only when migrating persisted legacy payloads. They
# are never emitted by the resolver and are not runtime projection maps.
migration_aliases:
  money: finance
  shopping: finance

resolver:
  rule: one_group_to_one_sphere
  priority: [house, technical_spheres, explicit_context, planets_tiebreak]
  output: [sphere, facet_or_null]
  unknown: unresolved
  planet_only_narrow_facets: forbidden

spheres:
  work:
    key: work
    title: "Работа"
    description: "Текущие задачи, карьера, статус и публичная роль."
    facets:
      - key: daily_work
        label: "Текущая работа"
        houses: [6]
        technical_spheres: [work_status_achievement]
        required_context: []
        modifiers:
          planets: [MARS, SATURN, SUN]
      - key: career_status
        label: "Карьера и статус"
        houses: [10]
        technical_spheres: [work_status_achievement]
        required_context: []
        modifiers:
          planets: [SUN, SATURN, JUPITER]

  finance:
    key: finance
    title: "Финансы"
    description: "Личные и общие ресурсы, деньги, покупки и обязательства."
    facets:
      - key: personal_money
        label: "Личные деньги"
        houses: [2]
