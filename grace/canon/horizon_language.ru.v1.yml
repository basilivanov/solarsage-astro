personal_statements:
  strength.structure.steady_responsibility:
    kind: strength
    text: Вы можете опираться на способность удерживать порядок, последовательность и ответственность в длинных задачах.
  strength.communication.structured_thinking:
    kind: strength
    text: Вы можете опираться на умение раскладывать сложное на шаги и проверять смысл договорённости.
  strength.energy.measured_effort:
    kind: strength
    text: Вам доступна способность дозировать усилие и сохранять направление после первого сопротивления.
  strength.relationships.tactful_clarity:
    kind: strength
    text: Вы можете соединять ясность формулировки с вниманием к тону и позиции другого человека.
  strength.direction.broad_view:
    kind: strength
    text: Вы можете опираться на способность видеть более широкий смысл, не теряя конкретной цели.
  strength.inner_clarity.name_reaction:
    kind: strength
    text: Вам может помогать способность назвать переживание словами до того, как переходить к действию.
  risk.structure.control_under_pressure:
    kind: risk
    text: Когда устойчивость нарушена, вы можете пытаться вернуть её через более жёсткий контроль, чем требует ситуация.
  risk.communication.overchecking:
    kind: risk
    text: В неопределённости вы можете дольше перепроверять решение и становиться жёстче к формулировкам.
  risk.energy.increase_pressure:
    kind: risk
    text: При сопротивлении вы можете усиливать нажим вместо того, чтобы сначала изменить темп или способ действия.
  risk.relationships.defensive_strictness:
    kind: risk
    text: Когда договорённость неясна, вы можете становиться сдержаннее и строже к её условиям раньше, чем появятся все факты.
  risk.inner_clarity.intensity_before_clarity:
    kind: risk
    text: При давлении реакция может усиливаться быстрее, чем успевает появиться ясность.
  risk.change.all_at_once:
    kind: risk
    text: Когда свободы мало, вы можете стремиться изменить всё сразу, даже если достаточно одного точного изменения.

