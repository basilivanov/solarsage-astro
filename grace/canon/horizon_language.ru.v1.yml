schema_version: horizon_language.ru.v1
version: v1
locale: ru

horizons:
  long:
    eyebrow: Долгий цикл
    actions_heading: Что перестраивать
    avoid_heading: Чего не закреплять
  medium:
    eyebrow: Текущий период
    actions_heading: Что попробовать
    avoid_heading: Чего пока не делать
  fast:
    eyebrow: Быстрый триггер
    actions_heading: Что сделать сейчас
    avoid_heading: Что лучше отложить

tone_labels:
  supportive: Поддерживающий фон
  neutral: Нейтральный фон
  tense: Напряжённый фон
  mixed: Смешанный фон

timing_state_labels:
  upcoming: Период ещё впереди
  building: Набирает силу
  active: Активно сейчас
  exact: Точный пик сейчас
  peaked: Пик уже пройден
  fading: Влияние постепенно ослабевает
  background: Фон уже действует

timing_templates:
  range: "С {active_from} по {active_until}"
  peak: "Точный пик — {exact_at}"
  valid_until: "Актуально до {active_until}"
  long_valid_until: "Ориентир до {active_until}"
  fast_eases: "Короткий пик ослабеет к {active_until}"

allowed_placeholders:
  - active_from
  - active_until
  - exact_at
  - range_label
  - peak_label
  - state_label
  - theme_label
  - sphere_label
  - target_label
  - source_label

techniques:
  annual_profection:
    label: Годовая профекция
    what_it_is: Профекция — символический годовой цикл, который выделяет одну жизненную тему и связанную с ней планету-управителя.
    why_it_matters_template: "В выбранном году профекция выделяет тему «{theme_label}». Её период: {range_label}."
  monthly_profection:
    label: Месячная профекция
    what_it_is: Месячная профекция уточняет годовую тему и показывает, какая её часть выходит на первый план в течение нескольких недель.
    why_it_matters_template: "Сейчас месячная профекция усиливает тему «{theme_label}». Окно: {range_label}."
  firdar_major:
    label: Большой период фирдара
    what_it_is: Фирдар — последовательность длинных планетарных периодов, которая описывает устойчивый фон этапа жизни, а не одно событие.
    why_it_matters_template: "Текущий большой период фирдара удерживает тему «{theme_label}» в длительном фокусе. Период: {range_label}."
  firdar_minor:
    label: Малый период фирдара
    what_it_is: Малый период фирдара уточняет длинный фон и показывает, какая его часть заметнее в текущем отрезке.
    why_it_matters_template: "Малый период фирдара усиливает тему «{theme_label}» внутри более длинного цикла. Период: {range_label}."
  solar_return:
    label: Соляр
    what_it_is: Соляр — карта на момент ежегодного возвращения Солнца, которая задаёт темы личного года.
    why_it_matters_template: "В текущем соляре заметнее тема «{theme_label}». Годовое окно: {range_label}."
  lunar_return:
    label: Лунар
    what_it_is: Лунар — карта возвращения Луны, описывающая более короткий эмоциональный и бытовой цикл.
    why_it_matters_template: "В текущем лунаре сильнее выделена тема «{theme_label}». Окно: {range_label}."
  solar_arc:
    label: Солнечная дуга
    what_it_is: Солнечная дуга — символическая техника медленных сдвигов, которая показывает длительно созревающую тему.
    why_it_matters_template: "Солнечная дуга связывает текущий этап с темой «{theme_label}». Период: {range_label}."
  secondary_progression:
    label: Вторичная прогрессия
    what_it_is: Вторичная прогрессия — символическая техника, которая описывает постепенное внутреннее развитие темы.
    why_it_matters_template: "Прогрессия делает тему «{theme_label}» более заметной в текущем этапе. Период: {range_label}."
  eclipse_window:
    label: Окно затмения
    what_it_is: Окно затмения — ограниченный период вокруг затмения, когда связанная тема может восприниматься острее обычного.
    why_it_matters_template: "Для выбранной даты окно затмения связано с темой «{theme_label}». Окно: {range_label}."
  transit_to_natal:
    label: Транзит к натальной планете
    what_it_is: Транзит показывает, как текущее положение планеты временно взаимодействует с положением планеты в вашей натальной карте.
    why_it_matters_template: "{source_label} затрагивает {target_label} и временно усиливает тему «{theme_label}». Окно: {range_label}."
  transit_to_angle:
    label: Транзит к углу карты
    what_it_is: "Такой транзит связывает текущее движение планеты с одной из опорных точек натальной карты: ASC, MC, DSC или IC."
    why_it_matters_template: "{source_label} затрагивает {target_label}, поэтому тема «{theme_label}» заметнее в этом окне: {range_label}."
  transit_to_lot:
    label: Транзит к жребию
    what_it_is: Такой транзит связывает текущую планету с расчётной точкой карты и используется только как дополнительный тематический сигнал.
    why_it_matters_template: "{source_label} затрагивает {target_label} и добавляет сигнал к теме «{theme_label}». Окно: {range_label}."
  transit_planet_in_house:
    label: Транзит планеты по дому
    what_it_is: Эта техника показывает, в какой области натальной карты сейчас движется планета и где её тема становится заметнее.
    why_it_matters_template: "{source_label} проходит через область, связанную с темой «{theme_label}». Окно: {range_label}."

themes:
  structure_boundaries_control:
    label: Опора, границы и контроль
    headline: Сейчас перестраивается способ удерживать опору
    intro_body: Длинный цикл меняет правила ответственности, текущий период проверяет границы, а короткий триггер показывает, где давление усиливает потребность всё контролировать.
    long:
      title: Перестройка опоры и ответственности
      plain_explanation: "Это медленный фон: он не требует немедленного решения, но постепенно меняет то, на что вы опираетесь и какие обязательства готовы считать своими."
    medium:
      title: Проверка границ на практике
      plain_explanation: В ближайшие недели тема проявляется через конкретные правила, роли и договорённости, которые можно проверить небольшими изменениями.
    fast:
      title: Короткий пик реакции на давление
      plain_explanation: Сегодня важнее не скорость, а пауза между внешним давлением и вашим решением, чтобы не спутать принципиальную границу с первой реакцией.
  communication_learning_documents:
    label: Формулировки, обучение и договорённости
    headline: Сейчас особенно важен способ назвать и проверить главное
    intro_body: Длинный цикл меняет привычный способ думать и договариваться, текущий период требует более точной формулировки, а короткий триггер показывает, где поспешный ответ создаёт лишний шум.
    long:
      title: Перестройка способа думать и объяснять
      plain_explanation: Длительный фон постепенно меняет ваши правила работы с информацией, обучением и важными договорённостями.
    medium:
      title: Окно для уточнения и проверки
      plain_explanation: "В ближайшие недели полезнее проверять смысл небольшими шагами: черновиком, вопросом и одной подтверждённой договорённостью."
    fast:
      title: Короткий пик в словах и реакции
      plain_explanation: Сегодня одна неточная фраза может весить больше обычного, поэтому сначала стоит отделить факт от интерпретации.
  relationships_values_closeness:
    label: Близость, ценности и взаимность
    headline: Сейчас уточняется, на чём держится взаимность
    intro_body: Длинный цикл меняет критерии близости и ценности, текущий период проверяет договорённости, а короткий триггер делает заметнее тон, дистанцию и реакцию на неопределённость.
    long:
      title: Пересборка критериев близости
      plain_explanation: Медленный фон помогает заметить, какие формы взаимности и уважения к границам действительно устойчивы для вас.
    medium:
      title: Проверка договорённостей в отношениях
      plain_explanation: В ближайшие недели важны не догадки о другом человеке, а один ясный вопрос, наблюдаемая реакция и конкретная договорённость.
    fast:
      title: Короткий пик чувствительности к тону
      plain_explanation: Сегодня реакция на дистанцию или формулировку может быть острее, поэтому вывод лучше делать после уточнения, а не по первому впечатлению.
  resources_security:
    label: Ресурсы, устойчивость и цена решений
    headline: Сейчас меняется способ создавать чувство устойчивости
    intro_body: Длинный цикл пересматривает опору на ресурсы, текущий период проверяет критерии достаточности, а короткий триггер показывает, где тревога подталкивает к лишнему решению.
    long:
      title: Перестройка ресурсной опоры
      plain_explanation: Этот фон постепенно меняет правила, по которым вы распределяете время, деньги, внимание и запас прочности.
    medium:
      title: Проверка одного ресурсного решения
      plain_explanation: В ближайшие недели полезен небольшой измеримый эксперимент вместо полной перестройки бюджета, условий или обязательств.
    fast:
      title: Короткий импульс вернуть контроль
      plain_explanation: Сегодня лучше отделить реальную необходимость от желания немедленно снять неопределённость покупкой, обещанием или резким отказом.
  energy_body_pacing:
    label: Энергия, нагрузка и темп
    headline: Сейчас важно точнее распределять усилие
    intro_body: Длинный цикл меняет отношение к нагрузке, текущий период проверяет рабочий темп, а короткий триггер показывает, где раздражение или спешка заставляют расходовать больше сил, чем нужно.
    long:
      title: Перестройка устойчивого темпа
      plain_explanation: Медленный фон предлагает пересмотреть не отдельный рывок, а привычную систему нагрузки, восстановления и запаса сил.
    medium:
      title: Эксперимент с объёмом и ритмом
      plain_explanation: В ближайшие недели полезно изменить один параметр нагрузки и наблюдать результат, не делая медицинских выводов из астрологического сигнала.
    fast:
      title: Короткий пик спешки или раздражения
      plain_explanation: Сегодня точнее сначала снизить лишнюю интенсивность, а затем решать, действительно ли нужно ускоряться.
  home_belonging:
    label: Дом, принадлежность и личное пространство
    headline: Сейчас уточняется, что даёт ощущение своего места
    intro_body: Длинный цикл меняет представление об опоре и принадлежности, текущий период проверяет бытовые правила и границы, а короткий триггер показывает, где неудобство быстро превращается в жёсткую реакцию.
    long:
      title: Пересборка ощущения дома и опоры
      plain_explanation: Этот фон касается не обязательного переезда или события, а более медленного пересмотра условий, в которых вам легче сохранять устойчивость.
    medium:
      title: Проверка бытовой договорённости
      plain_explanation: Если сейчас меняется домашний порядок, полезнее проверить одно правило или распределение ответственности, чем менять всё сразу.
    fast:
      title: Короткий пик чувствительности к пространству
      plain_explanation: Сегодня раздражение из-за порядка или границ лучше сначала назвать конкретно, не превращая его в общий вывод о ситуации.
  inner_clarity_recovery:
    label: Внутренняя ясность и восстановление
    headline: Сейчас особенно важно отличать сигнал от перегруза
    intro_body: Длинный цикл меняет способы восстанавливать ясность, текущий период показывает повторяющийся источник шума, а короткий триггер делает заметнее то, что требует паузы, а не немедленного вывода.
    long:
      title: Перестройка способов возвращать ясность
      plain_explanation: Медленный фон предлагает наблюдать, какие условия действительно помогают вам собраться, без диагнозов и обещаний гарантированного результата.
    medium:
      title: Проверка одного источника перегруза
      plain_explanation: В ближайшие недели полезно убрать или ограничить один повторяющийся источник шума и проверить эффект.
    fast:
      title: Короткий пик внутреннего шума
      plain_explanation: Сегодня первая мысль может быть громче, чем точнее, поэтому решение лучше отделить от момента максимальной перегрузки.
  direction_growth_meaning:
    label: Направление, рост и смысл
    headline: Сейчас уточняется, куда действительно стоит вкладываться
    intro_body: Длинный цикл меняет представление о направлении, текущий период проверяет одну возможность, а короткий триггер показывает, где вдохновение легко перепутать с обязательством немедленно выбрать весь путь.
    long:
      title: Пересмотр долгого направления
      plain_explanation: Этот фон помогает заново определить критерии роста и смысла, не требуя немедленно менять работу, обучение или место жизни.
    medium:
      title: Проверка направления малым шагом
      plain_explanation: В ближайшие недели полезнее провести один ограниченный тест интереса или возможности, чем заранее обещать себе весь маршрут.
    fast:
      title: Короткий пик ожиданий
      plain_explanation: Сегодня сильная идея заслуживает записи и проверки, но не обязана сразу становиться крупным обязательством.
  creativity_visibility:
    label: Творчество, проявленность и оценка
    headline: Сейчас меняется способ показывать результат
    intro_body: Длинный цикл перестраивает отношение к проявленности, текущий период предлагает проверить формат, а короткий триггер делает реакцию на оценку заметнее обычного.
    long:
      title: Перестройка отношения к проявленности
      plain_explanation: Медленный фон касается устойчивого способа создавать и показывать результат, а не требования постоянно быть заметнее.
    medium:
      title: Проверка формата на малой аудитории
      plain_explanation: В ближайшие недели полезно показать ограниченный черновик и собрать конкретную обратную связь, не связывая одну реакцию со всей своей ценностью.
    fast:
      title: Короткий пик реакции на оценку
      plain_explanation: Сегодня лучше отделить полезный факт обратной связи от эмоциональной оценки всего результата.
  change_innovation:
    label: Изменение, свобода и новый способ
    headline: Сейчас проверяется, что действительно пора менять
    intro_body: Длинный цикл делает старое правило теснее, текущий период позволяет испытать новый способ, а короткий триггер усиливает желание изменить всё немедленно.
    long:
      title: Пересмотр устаревшего правила
      plain_explanation: Этот фон помогает заметить систему, которая больше не работает, но не требует разрушать её до появления проверяемой замены.
    medium:
      title: Ограниченный эксперимент с новым способом
      plain_explanation: В ближайшие недели полезно изменить один элемент процесса и сравнить результат по заранее выбранному критерию.
    fast:
      title: Короткий импульс резко всё изменить
      plain_explanation: Сегодня новизна может казаться единственным выходом, поэтому сначала стоит проверить самое маленькое обратимое изменение.

product_spheres:
  work:
    label: Работа и статус
    manifestation_title: Где это может проявиться
    manifestation_body: Если сейчас меняются задачи, роль или объём ответственности, тема вероятнее проявится в правилах, сроках и договорённостях.
    conditional: true
  money:
    label: Деньги и ресурсы
    manifestation_title: Где это может проявиться
    manifestation_body: Если сейчас есть финансовое решение, тема вероятнее проявится в критериях достаточности, обязательствах и запасе прочности.
    conditional: true
  documents:
    label: Документы и формальности
    manifestation_title: Где это может проявиться
    manifestation_body: Если сейчас есть документ или формальная договорённость, тема вероятнее проявится в формулировках, сроках и распределении ответственности.
    conditional: true
  relationships:
    label: Отношения и близость
    manifestation_title: Где это может проявиться
    manifestation_body: Если сейчас есть важный разговор или договорённость с другим человеком, тема вероятнее проявится в тоне, взаимности и границах.
    conditional: true
  sport:
    label: Движение и тренировки
    manifestation_title: Где это может проявиться
    manifestation_body: Если на сегодня запланирована физическая нагрузка, тема вероятнее проявится в темпе, координации и выборе интенсивности.
    conditional: true
  communication:
    label: Общение
    manifestation_title: Где это может проявиться
    manifestation_body: Если сегодня есть важная переписка или разговор, тема вероятнее проявится в точности слов, вопросах и реакции на тон.
    conditional: true
  health:
    label: Самочувствие и режим
    manifestation_title: Где это может проявиться
    manifestation_body: Если вы оцениваете нагрузку или режим, тема вероятнее проявится в темпе и запасе сил; это не медицинский вывод или диагноз.
    conditional: true
  decisions:
    label: Решения
    manifestation_title: Где это может проявиться
    manifestation_body: Если сейчас нужно выбрать направление, тема вероятнее проявится в критериях решения, спешке и готовности оставить время на проверку.
    conditional: true
  travel:
    label: Поездки и маршруты
    manifestation_title: Где это может проявиться
    manifestation_body: Если сейчас планируется поездка или маршрут, тема вероятнее проявится в сроках, вариантах и необходимости перепроверить детали.
    conditional: true
  creativity:
    label: Творчество
    manifestation_title: Где это может проявиться
    manifestation_body: Если вы работаете над идеей или результатом, тема вероятнее проявится в формате, обратной связи и готовности показать черновик.
    conditional: true
  study:
    label: Обучение
    manifestation_title: Где это может проявиться
    manifestation_body: Если сейчас идёт обучение, тема вероятнее проявится в выборе фокуса, способе объяснения и проверке понимания.
    conditional: true
  shopping:
    label: Покупки
    manifestation_title: Где это может проявиться
